# Build every example plugin in `examples/` into a zip, publish the zips to
# the `gh-pages` branch under `<commit-sha>/examples/`, and produce a
# WordPress Playground link that boots a site with all of them (plus the
# Options View plugin) installed.
#
# ───────────────────────────── One-time setup ─────────────────────────────
#
# This workflow pushes to a `gh-pages` branch and relies on GitHub Pages
# serving it. Run these once from a clone of the repository (the `gh`
# commands act on the repo of the current directory):
#
# 1. Create an empty, orphan `gh-pages` branch and push it:
#
#        git switch --orphan gh-pages
#        git commit --allow-empty -m "Initialise gh-pages"
#        git push origin gh-pages
#        git switch -
#
# 2. Enable Pages, served from the root of `gh-pages`:
#
#     *  Settings → Pages → Source "Deploy from a branch" → `gh-pages`, `/ (root)`.
#     *  https://github.com/{owner}/{repo}/settings/pages
# Or: *  gh api --method POST repos/{owner}/{repo}/pages \
#          -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'
#
# 3. Allow workflows to push (the `permissions` block below asks for
#    `contents: write`, but that is only honoured if the repo allows it):
#
#     *  Settings → Actions → General → Workflow permissions → "Read and write".
#     *  https://github.com/{owner}/{repo}/settings/actions
# Or: *  gh api --method PUT repos/{owner}/{repo}/actions/permissions/workflow \
#          -f default_workflow_permissions=write -F can_approve_pull_request_reviews=false
#
# 4. Confirm the site URL the workflow will use:
#
#        gh api repos/{owner}/{repo}/pages --jq .html_url
#
# The "Check gh-pages exists" step below fails with these instructions if
# step 1 has not been done.
#
# Notes:
#  - Pull requests from forks run with a read-only token and cannot push to
#    gh-pages or comment; the build still runs so the zips are validated.
#  - Each run adds a `<sha>/` directory to gh-pages and never removes old
#    ones. Prune the branch manually if it grows too large.

name: Playground

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: playground-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  playground:
    runs-on: ubuntu-latest

    env:
      # For PRs use the head commit, not the synthetic merge commit, so the
      # Pages path matches the sha shown on the PR.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check gh-pages exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            cat <<'MSG'
          ::error::The `gh-pages` branch does not exist. One-time setup (run from a clone):

            # 1. Create and push an empty orphan branch
            git switch --orphan gh-pages
            git commit --allow-empty -m "Initialise gh-pages"
            git push origin gh-pages
            git switch -

            # 2. Enable GitHub Pages from the root of gh-pages
            gh api --method POST repos/{owner}/{repo}/pages \
              -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'

            # 3. Let workflows push to the repository
            gh api --method PUT repos/{owner}/{repo}/actions/permissions/workflow \
              -f default_workflow_permissions=write -F can_approve_pull_request_reviews=false

          See the comment at the top of .github/workflows/playground.yml.
          MSG
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Download Strauss
        run: |
          curl -sSL -o build/strauss.phar --create-dirs \
            https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar
          php build/strauss.phar --version

      # For each example:
      #  1. Work on a fresh copy of the checkout, because Strauss's
      #     `update_call_sites` rewrites src/ in place.
      #  2. Point Strauss at the example's vendor/ with a namespace prefix
      #     derived from the directory name (field-reference → FieldReference),
      #     so each example gets its own prefixed copy of the dependencies.
      #  3. Copy the (call-site-updated) framework src/ into the example as
      #     vendor/wp-wireframe/src and dump a Composer autoloader for it, with
      #     a per-example suffix so several examples can be active at once.
      #     Its vendor/autoload.php is replaced by a wrapper that chains the
      #     Strauss autoloader first, so the example's existing
      #     `require vendor/wp-wireframe/vendor/autoload.php` works unchanged.
      - name: Build example zips
        id: zips
        run: |
          set -euo pipefail
          mkdir -p build/work dist/examples
          names=()

          for dir in examples/*/; do
            name="$(basename "$dir")"
            prefix="$(perl -pe 's/(^|-)(\w)/\u$2/g' <<<"$name")"
            work="build/work/$name"
            echo "::group::Building $name (namespace prefix $prefix\\)"

            mkdir -p "$work"
            rsync -a \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='build' \
              --exclude='dist' \
              --exclude='.DS_Store' \
              ./ "$work/"

            jq --arg t "examples/$name/vendor" --arg p "$prefix\\" \
              '.extra.strauss = { target_directory: $t, namespace_prefix: $p, update_call_sites: true }' \
              "$work/composer.json" > "$work/composer.json.tmp"
            mv "$work/composer.json.tmp" "$work/composer.json"

            (cd "$work" && php "$GITHUB_WORKSPACE/build/strauss.phar" dependencies)

            pkg="$work/examples/$name/vendor/wp-wireframe"
            mkdir -p "$pkg"
            cp -R "$work/src" "$pkg/src"
            jq -n --arg s "$prefix" '{
              autoload: { "psr-4": { "Wireframe\\": "src/" } },
              config:   { "autoloader-suffix": $s }
            }' > "$pkg/composer.json"
            composer dump-autoload --working-dir "$pkg" --optimize --no-interaction

            # Composer's `files` autoload would be the natural way to chain the
            # Strauss autoloader in, but it keys entries by the hash of the
            # relative path, which is identical in every example, so only the
            # first active plugin's copy would ever load. Chain it explicitly.
            cat > "$pkg/vendor/autoload.php" <<PHP
          <?php
          // Generated by .github/workflows/playground.yml.
          // 1. Strauss-prefixed dependencies for this example (../../autoload.php).
          // 2. Composer autoloader for the Wireframe\\ namespace (src/).
          require_once dirname(__DIR__, 2) . '/autoload.php';
          require_once __DIR__ . '/composer/autoload_real.php';
          return ComposerAutoloaderInit${prefix}::getLoader();
          PHP

            (cd "$work/examples" && zip -qr "$GITHUB_WORKSPACE/dist/examples/$name.zip" "$name")
            unzip -l "dist/examples/$name.zip" | tail -1
            names+=("$name")
            echo "::endgroup::"
          done

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No directories found under examples/"
            exit 1
          fi

          echo "names=${names[*]}" >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the URL GitHub reports (handles custom domains); fall back
          # to the conventional one if Pages hasn't been enabled yet.
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null || true)"
          if [ -z "$url" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            repo="${GITHUB_REPOSITORY#*/}"
            url="https://${owner}.github.io/${repo}/"
            echo "::warning::Could not read Pages settings; assuming $url"
          fi
          url="${url%/}/${SHA}/examples"
          echo "base=$url" >> "$GITHUB_OUTPUT"

      # The blueprint is published next to the zips and referenced by URL.
      # GitHub Pages sends `Access-Control-Allow-Origin: *`, which Playground
      # needs to fetch both the blueprint and the plugin zips.
      - name: Write Playground blueprint
        id: blueprint
        env:
          BASE: ${{ steps.pages.outputs.base }}
          NAMES: ${{ steps.zips.outputs.names }}
        run: |
          set -euo pipefail
          steps='[]'
          for name in $NAMES; do
            steps="$(jq -c --arg url "$BASE/$name.zip" \
              '. + [{step:"installPlugin", pluginData:{resource:"url", url:$url}, options:{activate:true}}]' <<<"$steps")"
          done
          steps="$(jq -c \
            '. + [{step:"installPlugin", pluginData:{resource:"wordpress.org/plugins", slug:"options-view"}, options:{activate:true}}]' <<<"$steps")"

          jq -n --argjson steps "$steps" '{
            "$schema": "https://playground.wordpress.net/blueprint-schema.json",
            landingPage: "/wp-admin/plugins.php",
            login: true,
            preferredVersions: { php: "8.2", wp: "latest" },
            features: { networking: true },
            steps: $steps
          }' > dist/examples/blueprint.json

          cat dist/examples/blueprint.json

          link="https://playground.wordpress.net/?blueprint-url=${BASE}/blueprint.json"
          echo "link=$link" >> "$GITHUB_OUTPUT"

      - name: Upload zips as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-plugins-${{ env.SHA }}
          path: dist/examples

      - name: Publish to gh-pages
        # Forked PRs have a read-only token; skip rather than fail.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/examples
          destination_dir: ${{ env.SHA }}/examples
          keep_files: true
          commit_message: 'Publish example plugins for ${{ env.SHA }}'

      - name: Compose summary
        id: summary
        env:
          BASE: ${{ steps.pages.outputs.base }}
          LINK: ${{ steps.blueprint.outputs.link }}
          NAMES: ${{ steps.zips.outputs.names }}
        run: |
          {
            echo "## WordPress Playground"
            echo
            echo "[Open all example plugins in Playground]($LINK)"
            echo
            echo "Built from \`${SHA}\`. Plugins installed:"
            echo
            for name in $NAMES; do
              echo "- [\`$name.zip\`]($BASE/$name.zip)"
            done
            echo "- [options-view](https://wordpress.org/plugins/options-view/) from wordpress.org"
            echo
            echo "Blueprint: $BASE/blueprint.json"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playground
          path: summary.md

      - name: Append link to release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh release view "${{ github.event.release.tag_name }}" --json body --jq .body)"
          printf '%s\n\n%s\n' "$current" "$(cat summary.md)" > body.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file body.md
